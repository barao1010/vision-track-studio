name: OBS audiovisual parity
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/**'
      - '.github/workflows/obs-parity.yml'
permissions:
  contents: read
concurrency:
  group: obs-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install av==16.0.1 numpy==2.2.6
      - run: python -m unittest discover -s validation -p 'test_*.py' -v
  exercise:
    needs: validator-tests
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, vision]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: vision-track-studio
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: f082210c177a03572cace88c168d0f32d8cde39e
          path: obs-studio
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0 av==16.0.1 numpy==2.2.6
      - name: Apply Vision changes only to derivative
        if: matrix.flavor == 'vision'
        run: |
          python vision-track-studio/scripts/brand_windows.py obs-studio
          python vision-track-studio/scripts/integrate_studio.py obs-studio
          python vision-track-studio/scripts/generate_identity.py obs-studio
          python vision-track-studio/scripts/apply_dashboard.py obs-studio
      - name: Configure
        working-directory: obs-studio
        run: cmake --preset windows-x64
      - name: Build
        working-directory: obs-studio
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel 4
      - name: Prepare isolated portable exercise
        run: python vision-track-studio/validation/prepare.py obs-studio/build_x64/rundir/RelWithDebInfo ${{ matrix.flavor }}
      - name: Record identical scene, browser, image and audio exercise
        shell: pwsh
        run: |
          $binary = if ('${{ matrix.flavor }}' -eq 'vision') { 'vision-track-studio.exe' } else { 'obs64.exe' }
          $exe = Resolve-Path "obs-studio/build_x64/rundir/RelWithDebInfo/bin/64bit/$binary"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList '--portable', '--disable-updater', '--disable-shutdown-check', '--profile', 'Parity', '--collection', 'Parity' -PassThru
          try {
            $finished = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited: $($process.ExitCode)" }
              if (Test-Path 'vision-track-studio/validation/exercise.json') { $finished = $true; break }
            }
            if (-not $finished) { throw 'Audiovisual exercise did not finish' }
            python vision-track-studio/validation/measure.py measure vision-track-studio/validation
            if ($LASTEXITCODE -ne 0) { throw 'Recorded audiovisual validation failed' }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(10000)) { $process.Kill() }
            }
          }
      - name: Upload measurements, recording and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.flavor }}
          path: |
            vision-track-studio/validation/measurements.json
            vision-track-studio/validation/exercise.json
            vision-track-studio/validation/recordings/*.mkv
            obs-studio/build_x64/rundir/RelWithDebInfo/config/**/logs/*.txt
          if-no-files-found: warn
  compare:
    needs: exercise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install av==16.0.1 numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: comparison
      - name: Compare measured upstream and Vision recordings
        shell: bash
        run: |
          upstream=$(find comparison/parity-upstream -name measurements.json -print -quit)
          vision=$(find comparison/parity-vision -name measurements.json -print -quit)
          test -n "$upstream" && test -n "$vision"
          python validation/measure.py compare "$upstream" "$vision"
