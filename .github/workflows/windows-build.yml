name: Windows build (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'scripts/**'
      - 'tracking/**'

permissions:
  contents: read

jobs:
  tracking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q tracking
      - name: Test PTZ tracking controller
        working-directory: tracking
        run: python -m unittest discover -p 'test_*.py' -v

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Checkout Vision Track Studio preparation
        uses: actions/checkout@v4
        with:
          path: vision-track-studio

      - name: Checkout OBS upstream including submodules
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          path: obs-studio
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          git --version

      - name: Apply Vision Track Studio metadata branding
        shell: pwsh
        run: python vision-track-studio/scripts/brand_windows.py obs-studio

      - name: Configure OBS Windows x64
        shell: pwsh
        working-directory: obs-studio
        run: cmake --preset windows-x64

      - name: Build OBS Windows x64
        shell: pwsh
        working-directory: obs-studio
        run: cmake --build --preset windows-x64 --config RelWithDebInfo

      - name: Bundle build for review
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Path "obs-studio" -Filter "obs64.exe" -Recurse -File -ErrorAction SilentlyContinue
          if (-not $candidates) { throw "obs64.exe not found - build did not produce runnable executable" }
          $exe = $candidates | Where-Object { $_.FullName -match "rundir" } | Select-Object -First 1
          if (-not $exe) { throw "Executable found outside rundir; cannot safely bundle its dependencies" }
          $dir = $exe.Directory.FullName
          Write-Host "Packaging runtime directory: $dir"
          Compress-Archive -Path (Join-Path $dir "*") -DestinationPath "vision-track-studio-experimental-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vision-track-studio-partial-branding-windows-x64-experimental
          path: vision-track-studio-experimental-windows-x64.zip
          if-no-files-found: error
