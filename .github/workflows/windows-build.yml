name: Vision Track Studio Windows preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'scripts/**'
      - 'tracking/**'
permissions:
  contents: write
concurrency:
  group: studio-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tracking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q tracking scripts
      - run: c++ -std=c++17 -Ivalidation/native_stubs validation/native_zoom_state.cpp -o /tmp/vision-zoom-state-test
      - run: /tmp/vision-zoom-state-test
      - working-directory: tracking
        run: python -m unittest discover -p 'test_*.py' -v
  windows-x64:
    needs: tracking-tests
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: vision-track-studio
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: f082210c177a03572cace88c168d0f32d8cde39e
          path: obs-studio
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply native identity and PTZ dock
        run: |
          python -m pip install pillow==11.3.0 reportlab==4.4.3
          python vision-track-studio/scripts/brand_windows.py obs-studio
          python vision-track-studio/scripts/integrate_studio.py obs-studio
          python vision-track-studio/scripts/generate_identity.py obs-studio
          python vision-track-studio/scripts/apply_dashboard.py obs-studio
          python vision-track-studio/scripts/build_manual.py vision-track-studio/tracking/USO-PTZ.md Vision-Track-Studio-Manual-PT.pdf
      - name: Configure Windows
        working-directory: obs-studio
        run: cmake --preset windows-x64
      - name: Build Windows
        working-directory: obs-studio
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel 4
      - name: Package tracking worker
        working-directory: vision-track-studio
        run: |
          python -m pip install -r tracking/requirements.txt pyinstaller==6.16.0
          python scripts/prepare_tracking_model.py
          python -m PyInstaller --noconfirm --clean --onedir --console --name vision-track-worker --paths tracking --add-data "tracking/models;models" tracking/native_worker.py
          & "dist/vision-track-worker/vision-track-worker.exe" --self-test
          python scripts/prepare_speech_model.py
          python scripts/prepare_default_bible.py
          python -m PyInstaller --noconfirm --clean --onedir --console --name vision-bible-worker --paths tracking --collect-all vosk --add-data "tracking/models/speech-model;speech-model" --add-data "tracking/data;data" tracking/bible_worker.py
          & "dist/vision-bible-worker/vision-bible-worker.exe" --self-test
      - name: Bundle complete runtime, licenses and source
        shell: pwsh
        run: |
          $runtime = 'obs-studio/build_x64/rundir/RelWithDebInfo'
          if (-not (Test-Path "$runtime/bin/64bit/vision-track-studio.exe")) { throw 'Studio executable missing' }
          Copy-Item vision-track-studio/dist/vision-track-worker "$runtime/bin/64bit/vision-track-worker" -Recurse
          Copy-Item vision-track-studio/dist/vision-bible-worker "$runtime/bin/64bit/vision-bible-worker" -Recurse
          Copy-Item vision-track-studio/tracking/models/LICENSE-VOSK.txt "$runtime/LICENSE-VOSK.txt"
          Copy-Item vision-track-studio/tracking/data/LICENSE-BPM.txt "$runtime/LICENSE-BPM.txt"
          Copy-Item obs-studio/COPYING "$runtime/COPYING"
          New-Item -ItemType Directory -Force "$runtime/manuals" | Out-Null
          Copy-Item Vision-Track-Studio-Manual-PT.pdf "$runtime/manuals/Vision-Track-Studio-Manual-PT.pdf"
          Copy-Item vision-track-studio/tracking/USO-PTZ.md "$runtime/USO-PTZ.md"
          Copy-Item vision-track-studio/tracking/LICENSES.md "$runtime/LICENSES-TRACKING.md"
          Copy-Item vision-track-studio/tracking/models/LICENSE-GPL3.txt "$runtime/COPYING-GPL3"
          python vision-track-studio/scripts/package_source.py Vision-Track-Studio-Source.zip obs-studio vision-track-studio
          Compress-Archive -Path "$runtime/*" -DestinationPath Vision-Track-Studio-Windows-preview.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' vision-track-studio/scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Validate installed application with actual audiovisual recording
        shell: pwsh
        run: |
          $installer = Resolve-Path 'Vision-Track-Studio-Setup-preview.exe'
          $installed = Join-Path $env:RUNNER_TEMP 'vision-installed-validation'
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installed" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $exe = Join-Path $installed 'bin/64bit/vision-track-studio.exe'
          if (-not (Test-Path $exe)) { throw 'Installed application missing' }
          if (-not (Test-Path "$installed/bin/64bit/vision-bible-worker/_internal/data/BPM.json")) { throw 'Installed Bible data missing' }
          python -m pip install av==16.0.1 numpy==2.2.6 websocket-client==1.8.0
          python vision-track-studio/validation/prepare.py $installed vision
          if ($LASTEXITCODE -ne 0) { throw 'Installed test profile preparation failed' }
          $env:VTS_DISABLE_UPDATE_CHECK = '1'
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList '--portable', '--disable-updater', '--disable-shutdown-check', '--profile', 'Parity', '--collection', 'Parity' -PassThru
          try {
            python vision-track-studio/validation/exercise.py
            if ($LASTEXITCODE -ne 0) { throw 'Installed audiovisual validation failed' }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(10000)) { $process.Kill() }
            }
          }
      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'obs-studio/build_x64/rundir/RelWithDebInfo/bin/64bit/vision-track-studio.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Startup failed: $($process.ExitCode)" }
      - name: Check actual Windows application window
        shell: pwsh
        run: |
          python vision-track-studio/validation/prepare.py obs-studio/build_x64/rundir/RelWithDebInfo vision
          if ($LASTEXITCODE -ne 0) { throw 'GUI test profile preparation failed' }
          $exe = Resolve-Path 'obs-studio/build_x64/rundir/RelWithDebInfo/bin/64bit/vision-track-studio.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList '--portable', '--disable-updater', '--disable-shutdown-check' -PassThru
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited during GUI startup: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0 -and $process.Responding) { $windowReady = $true; break }
            }
            if (-not $windowReady) { throw 'No responsive application window appeared' }
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited -or -not $process.Responding) { throw 'Application failed after window initialization' }
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path (Get-Location) 'Vision-Track-Studio-UI.png'))
            } finally { $graphics.Dispose(); $bitmap.Dispose() }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(10000)) { $process.Kill() }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Vision-Track-Studio-Windows-preview
          path: |
            Vision-Track-Studio-Windows-preview.zip
            Vision-Track-Studio-Setup-preview.exe
            Vision-Track-Studio-Source.zip
            Vision-Track-Studio-Manual-PT.pdf
            Vision-Track-Studio-UI.png
            vision-track-studio/validation/results/**/measurements.json
            vision-track-studio/validation/results/**/recordings/*.mkv
          if-no-files-found: error
      - name: Publish explicitly experimental release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-preview.${{ github.run_number }}"
          gh release create $tag Vision-Track-Studio-Windows-preview.zip Vision-Track-Studio-Setup-preview.exe Vision-Track-Studio-Source.zip Vision-Track-Studio-Manual-PT.pdf --repo '${{ github.repository }}' --target '${{ github.sha }}' --prerelease --title "Vision Track Studio $tag" --notes 'Windows preview based on OBS. Includes native PTZ connection and target-selection dock. Experimental visual tracking; real camera, broadcast, audio and UI validation remain required. Corresponding GPL sources included. Not a final production release.'

