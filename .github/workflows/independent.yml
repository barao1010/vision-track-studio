name: Independent engine
on:
  push:
    branches: [independent-engine]
  pull_request:
    branches: [independent-engine]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      VISION_TRACK_TEST_WEB: '1'
      VISION_TRACK_TEST_RTMP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Fetch verified YOLOX model
        run: python -m scripts.fetch_models
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Install external FFmpeg for tests
        run: choco install ffmpeg --no-progress -y
      - name: Engine, A/V, protocols, RTMP and browser tests
        run: python -m unittest discover -s tests -v
      - name: Verify model inference on a fixed public image
        run: python -m scripts.verify_detection
      - name: Desktop startup and screenshot
        run: python -m scripts.smoke
      - name: Build identity and development manual
        run: |
          python -m scripts.build_assets
          python -m scripts.build_manual
      - name: Package development desktop
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name VisionTrackStudio --icon assets/vision-track.ico --collect-all playwright --collect-all cv2 --collect-all sounddevice --add-data "models;models" run_studio.py
      - name: Collect dependency notices
        run: python -m scripts.collect_notices
      - name: Packaged desktop startup test
        shell: pwsh
        run: |
          $process = Start-Process dist/VisionTrackStudio/VisionTrackStudio.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Desktop startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - name: Build development installer and portable
        shell: pwsh
        run: |
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item docs dist/VisionTrackStudio/docs -Recurse
          Compress-Archive -Path dist/VisionTrackStudio -DestinationPath dist/Vision-Track-Studio-0.2.0-dev.2-Portable.zip
          git archive --format=zip --output=dist/Vision-Track-Studio-0.2.0-dev.2-Source.zip HEAD
      - name: Install and test development installer
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'VisionTrackStudioInstallTest'
          $setup = Start-Process dist/Vision-Track-Studio-0.2.0-dev.2-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Install failed: $($setup.ExitCode)" }
          $app = Start-Process (Join-Path $installPath 'VisionTrackStudio.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(45000)) { $app.Kill(); throw 'Installed desktop timed out' }
          if ($app.ExitCode -ne 0) { throw "Installed desktop failed: $($app.ExitCode)" }
          $uninstall = Start-Process (Join-Path $installPath 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Upload development packages (not a final Release)
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Track-Studio-0.2.0-dev.2-Windows
          path: |
            dist/*Setup.exe
            dist/*Portable.zip
            dist/*Source.zip
            docs/Vision-Track-Studio-Manual-PT.pdf
            assets/desktop.png
